<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>

    <style>
        p {
            font-size: 20px;
        }
        .input-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 10px;
        }

        .input-field {
            width: 300px;
            padding: 10px 10px;
            border-radius: 3px;
        }

        .input-password-container {
            display: flex;
            gap: 10px;
        }

        .button-container {
            display: flex;
            gap: 10px;
        }

        .button {
            background-color: rgb(0, 123, 255);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 15px 20px;
            font-size: 15px;
        }

    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <!-- <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script> -->
    <script src="1.js"></script>
    <script src="2.js"></script>

    <script src="3.js"></script>
    <!-- <script src="https://unpkg.com/supersimpledev/babel.js"></script> -->

    <script type="text/babel">
        const container = document.querySelector('.js-container');

        const Paragraph = () => {
            return (
                <p>Hello, welcome to my website</p>
            )
        }

        const Inputs = () => {
            const [showPassword, setShowPassword] = React.useState(false)

            function handlePasswordField () {
                setShowPassword(showPassword === true ? false: true)
            }
            return (
                <div className="input-container">
                    <input className="input-field" placeholder="Email"/>
                    <div className="input-password-container">
                        <input className="input-field" type={showPassword === false ? "password": "text"} placeholder="Password"/>
                        <button onClick={handlePasswordField}>
                            {showPassword === false ? "Show": "Hide"}
                        </button>
                    </div>
                </div>
            )
        }

        const Buttons = () => {
            return (
                <div className="button-container">
                    <button className="button">
                        Login
                    </button>
                    <button className="button">
                        Sign up
                    </button>
                    
                </div>
            )
        }
        const App = () => {
            return (
                <div>
                    <Paragraph/>
                    <Inputs/>
                    <Buttons/>

                </div>
            )
        }


        ReactDOM.createRoot(container).render(<App/>);

    </script>
  </body>
</html>
