<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <style>
    body {
      font-family: Arial;
      margin: 0px;
    }

    .send-button {
      background-color: rgb(25, 135, 84);
      color: white;
      padding: 12px 20px;
      margin-left: 10px;
      border: none;
      border-radius:10px;
      font-size: 15px;
      cursor: pointer;
    }

    .chat-input {
      font-size: 15px;
      border-width: 1px;
      border-radius: 10px;
      padding: 12px 15px;
      flex-grow: 1;
    }

    .chat-input-container {
      display: flex;
      margin-bottom: 60px;
    }

    .app-container {
      max-width: 600px;
      margin: 0 auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .chat-message-user {
      display: flex;
      justify-content: end;
      align-items: start;
    }

     .chat-message-robot {
        display: flex;
        align-items: start;
     }

    .chat-message-text {
      background-color: rgb(238, 238, 238);
      padding: 15px 20px;
      border-radius: 10px;
      margin-right: 10px;
      margin-left: 10px;
      margin-bottom: 20px;
      max-width: 300px;
    }

    .chat-message-profile {
      width: 45px;
    }

    .chat-messages-container {
      flex-grow: 1;
      margin-top: 20px;
      overflow: scroll;
      scrollbar-width: none;
    }

    .empty-chat-text {
      text-align: center;
      font-size: 20px;
      margin-top: 200px;
    }

    .load-spinner {
      height: 40px;
      margin: -15px;
    }
  </style>
  <body>
    <div class="js-container"></div>

    <!-- <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script> -->
    <script src="1.js"></script>
    <script src="2.js"></script>

    <script src="3.js"></script>
    <script src="4.js"></script>
    <!-- <script src="https://unpkg.com/supersimpledev/babel.js"></script> -->

    <script type="text/babel">
      const container = document.querySelector('.js-container');

      function useAutoScroll(dependencies) {
          const Ref = React.useRef(null);

          React.useEffect(() => {
            const containerElem = Ref.current
            if (containerElem) {
              containerElem.scrollTop = containerElem.scrollHeight
            }
          }, [dependencies])

          return Ref
        }

     
      const ChatInput = ({chatMessages, setChatMessages}) => {
        const [inputText, setInputText] = React.useState("")

        function saveInputText(event) {
          setInputText(event.target.value)
        }

        async function sendMessage() {
          const newChatMessages = [
          ...chatMessages,
          {
            message: inputText,
            sender: "user",
            id: crypto.randomUUID()
          }
        ]
          setChatMessages(newChatMessages);
          setChatMessages([
            ...newChatMessages,
            {
              message: <img className="load-spinner" src="loading-spinner.gif"/>,
              sender: "robot",
              id: crypto.randomUUID()
            }

          ]);

        const response = await Chatbot.getResponseAsync(inputText);
          setChatMessages([
          ...newChatMessages,
          {
            message: response,
            sender: "robot",
            id: crypto.randomUUID()
          }
        ]);

        setInputText("")
        }

        function checkKeyType(event) {
          if (event.key === "Enter") {
            sendMessage(event.target.value)
          }
          
          if (event.key === "Escape") {
            setInputText("")
          }

        }

        return (
        <div className="chat-input-container">
          <input 
            type="text" 
            placeholder="Send a message to chatbot" 
            size="30"
            onChange={saveInputText}
            value={inputText}
            onKeyDown={checkKeyType}
            className="chat-input"
          />
          <button onClick={sendMessage} className="send-button">Send</button>
        </div>
      )
      };

      const ChatMessage = (props) => {
        const message = props.message
        const sender = props.sender

        
        return (
          <div className={sender === "user" ? "chat-message-user": "chat-message-robot"}>
            {sender === "robot" && <img src="default.png" alt="" className="chat-message-profile"/>}
            <div className="chat-message-text">
              {message}
            </div>
            {sender === "user" && <img src="henry.jpg" alt="" className="chat-message-profile"/>}
          </div>
        )
      }
      
      const ChatMessages = ({chatMessages}) => {
        // const chatMessagesRef = React.useRef(null);

        // React.useEffect(() => {
        //   const containerElem = chatMessagesRef.current
        //   if(containerElem) {
        //     containerElem.scrollTop = containerElem.scrollHeight
        //   }
        // }, [chatMessages])

        const chatMessagesRef = useAutoScroll(chatMessages)

        return (
        <div className="chat-messages-container" ref={chatMessagesRef}>
          {chatMessages.length !== 0 &&

            chatMessages.map((chatMessage) => {
              return (<ChatMessage
                message={chatMessage.message}
                sender={chatMessage.sender}
                key={chatMessage.id}
                />
              );
            })

          } 


          {chatMessages.length === 0 && <p className="empty-chat-text">Welcome to BCHAT-BOT, Send a message using the text box below</p>}
        </div>
        )
      }

      
      const App = () => {
        const array = React.useState([
          // {
          //   message: "Hello chat bot",
          //   sender: "user",
          //   id: "1"
          // },

          // {
          //   message: "Hello how can I help you",
          //   sender: "robot",
          //   id: "2"
          // },
          // {
          //   message: "Can you get me today's date",
          //   sender: "user",
          //   id: "3"
          // },

          // {
          //   message: "Today's is September 3rd",
          //   sender: "robot",
          //   id: "4"
          // }
        ])
        
        const chatMessages = array[0]
        const setChatMessages = array[1]

        return (
          <div className="app-container">

            <ChatMessages
              chatMessages={chatMessages}
            />
            <ChatInput
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}
            />
          </div>
      )
      }

     
      ReactDOM.createRoot(container).render(<App/>);
    </script>
  </body>
</html>
